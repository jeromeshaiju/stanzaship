<!DOCTYPE html>
{% load static %}
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="icon" type="image/x-icon" href="{% static 'images/favicon.ico' %}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css" integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
    <link href='https://fonts.googleapis.com/css?family=Pangolin' rel='stylesheet'>
    <style>
        body {
            background-color: #fce4ec; /* Baby Pink */
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            font-family: sans-serif;
            padding-top: 100px;
        }

        .main-container {
            background-color: #ffffff;
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .navbar-brand img {
            width: 50px;
            height: 50px;
            object-fit: cover;
        }

        /* Form styling */
        .form-group label {
            font-weight: 600;
            color: #333;
        }

        .form-control {
            border-radius: 4px;
            border: 1px solid #e0e0e0;
            padding: 10px;
            margin-bottom: 15px;
        }

        .form-control:focus {
            border-color: #ff69b4;
            box-shadow: 0 0 0 0.2rem rgba(255, 105, 180, 0.25);
        }

        /* Button styling */
        .btn-primary, .btn-pink {
            background-color: #ff69b4;
            border-color: #ff69b4;
            font-weight: 600;
            padding: 10px 20px;
            border-radius: 4px;
            width: 100%;
            margin-bottom: 10px;
        }

        .btn-primary:hover, .btn-pink:hover {
            background-color: #ff1493;
            border-color: #ff1493;
        }

        .btn-google {
            background-color: #4285F4;
            border-color: #4285F4;
            color: white;
            font-weight: 600;
            padding: 12px 20px;
            border-radius: 4px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: all 0.3s ease;
            margin-bottom: 10px;
        }

        .btn-google:hover {
            background-color: #357ae8;
            border-color: #357ae8;
            text-decoration: none;
            color: white;
        }

        .btn-google img {
            width: 20px;
            height: 20px;
            margin-right: 10px;
        }

        .divider {
            text-align: center;
            margin: 20px 0;
            position: relative;
        }

        .divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background-color: #e0e0e0;
        }

        .divider span {
            background-color: #ffffff;
            padding: 0 10px;
            position: relative;
            color: #666;
            font-size: 14px;
        }

        .auth-link {
            text-align: center;
            margin-top: 20px;
            color: #666;
        }

        .auth-link a {
            color: #ff69b4;
            font-weight: 600;
            text-decoration: none;
        }

        .auth-link a:hover {
            text-decoration: underline;
        }

        h1, h2, h3 {
            color: #333;
            font-family: 'Pangolin', cursive;
            margin-bottom: 20px;
        }

        .errorlist {
            list-style: none;
            padding: 10px;
            background-color: #ffebee;
            border: 1px solid #ff69b4;
            border-radius: 4px;
            color: #c2185b;
            margin-bottom: 15px;
        }

        .helptext {
            display: block;
            font-size: 0.875rem;
            color: #666;
            margin-top: 5px;
        }
    </style>
    {% block extra_css %}{% endblock %}
    <title>{% block title %}STANZASHIP{% endblock %}</title>
</head>
<body>
    {% include "header.html" %}

    <div class="main-container">
        {% block content %}{% endblock %}
    </div>

    <script src="https://code.jquery.com/jquery-3.4.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/js/bootstrap.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
